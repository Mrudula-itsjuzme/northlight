name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, tests, architecture, benchmarks, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests
        run: npm test

      - name: Architecture Boundary Tests
        run: npx vitest run tests/architecture/architecture.test.ts

      - name: Performance Benchmark Tests
        run: npx vitest run tests/benchmark/benchmark.test.ts

      - name: Production Build
        run: npm run build
